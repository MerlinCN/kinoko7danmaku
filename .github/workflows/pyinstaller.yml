name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true' # 检出所有子模块

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Extract version from tag
        id: get_version
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref }}".Replace('refs/tags/v', '')
          } else {
            $version = "dev"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify version matches tag
        shell: pwsh
        env:
          TAG_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          $version = (python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
          if ($version -ne $env:TAG_VERSION) {
            throw "pyproject.toml 的版本 $version 与 tag v$env:TAG_VERSION 不一致"
          }
          Write-Host "版本校验通过：$version"

      - name: Install dependencies
        run: uv sync --dev

      - name: Inject telemetry config
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          $json = @{ sentry_dsn = $env:SENTRY_DSN } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location).Path "resource/telemetry.json"),
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Build with PyInstaller
        run: uv run pyinstaller kinoko7danmaku.spec

      - name: Smoke test packaged exe
        shell: pwsh
        run: |
          # 判定以报告内容为准：报告是在主窗口构建并绘制完成之后才写的，
          # 进程退出阶段的抖动不该拦发布
          $report = "selftest.txt"
          Remove-Item $report -ErrorAction SilentlyContinue
          $p = Start-Process "dist/Kinoko7Danmaku.exe" -ArgumentList '--selftest' `
                 -WorkingDirectory (Get-Location) -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(180000)) {
            $p.Kill()
            throw "自检超时（180s）"
          }
          if (-not (Test-Path $report)) {
            throw "自检没有产出报告，退出码 $($p.ExitCode)"
          }
          $content = Get-Content $report -Raw
          Write-Host $content
          if (-not $content.TrimStart().StartsWith('ok')) {
            throw "自检失败，退出码 $($p.ExitCode)"
          }
          if ($p.ExitCode -ne 0) {
            Write-Warning "自检通过，但进程退出码为 $($p.ExitCode)"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kinoko7Danmaku
          path: dist/Kinoko7Danmaku.exe
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Kinoko7Danmaku

      - name: Generate checksum
        run: sha256sum Kinoko7Danmaku.exe > Kinoko7Danmaku.exe.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          files: |
            Kinoko7Danmaku.exe
            Kinoko7Danmaku.exe.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
