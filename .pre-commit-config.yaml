# Pre-commit hooks configuration
# See https://pre-commit.com for more information

ci:
  skip: [tombi-lint, tombi-format]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v0.9.25
    hooks:
      - id: tombi-lint
        args: ["--offline"]
      - id: tombi-format
        args: ["--offline"]

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args:
          # https://github.com/astral-sh/ruff-pre-commit/issues/64
          - '--fix'
          - '--unsafe-fixes'
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.8
    hooks:
      - id: uv-lock
      - id: uv-export
        args:
          - '-o'
          - 'requirements.txt'
          - '--no-hashes'

# Configuration options
default_language_version:
  python: python3.12

# Run on all files initially (for setup)
# After setup, only runs on changed files
fail_fast: false
